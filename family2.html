<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>共享资料系统</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f0e8; margin: 0; padding: 16px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #8b5a2b; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 1.6rem; }
        .header p { margin: 8px 0 0; opacity: 0.9; font-size: 0.85rem; }
        .content { padding: 20px; }
        .folder-select-area { background: #f0e8d8; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .folder-status { font-size: 0.85rem; font-weight: bold; }
        .folder-btn { background: #8b5a2b; color: white; border: none; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-size: 0.85rem; }
        .folder-btn:disabled { opacity: 0.6; cursor: default; background: #aaa; }
        .input-area { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .input-area input { flex: 1; padding: 12px 16px; font-size: 1rem; border: 1px solid #ddd; border-radius: 30px; outline: none; }
        .input-area button { background: #8b5a2b; color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; background: #aaa; }
        .stat-btn { background: #2c5a2c; } 
        .output { background: #faf8f0; border-radius: 16px; padding: 16px; max-height: 600px; overflow-y: auto; font-size: 0.85rem; line-height: 1.5; border: 1px solid #e0d6c0; }
        .output pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 0.8rem; }
        .clickable-name { cursor: pointer; color: #8b5a2b; text-decoration: underline dotted; transition: all 0.2s; }
        .clickable-name:hover { color: #c07830; background-color: #f0e8d8; border-radius: 4px; }
        .footer { text-align: center; padding: 16px; font-size: 0.7rem; color: #aaa; border-top: 1px solid #eee; }
        .to-top { position: fixed; bottom: 20px; right: 20px; background: #8b5a2b; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.7; z-index: 100; }
        .to-top:hover { opacity: 1; }
        audio, video { max-width: 100%; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }

        #statModal { z-index: 1000; }
        #mediaModal { z-index: 1001; }

        .modal-container {
            background: #fffef7;
            border-radius: 32px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .modal-header {
            background: #8b5a2b;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .modal-header h3 { margin: 0; font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
        }
        .modal-close:hover { background: rgba(255, 255, 255, 0.2); }
        .modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; background: #fefcf5; }

        .file-list-modal {
            background: #faf8f0;
            border-radius: 20px;
            padding: 8px 0;
            margin-bottom: 20px;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #e0d6c0;
        }
        .file-item-modal {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #e8e0d0;
            cursor: pointer;
            transition: background 0.15s;
        }
        .file-item-modal:hover { background: #f0e8d8; }
        .file-icon-modal { font-size: 1.3rem; margin-right: 14px; width: 32px; text-align: center; }
        .file-name-modal { flex: 1; word-break: break-all; font-size: 0.9rem; }
        .media-preview-modal {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-top: 8px;
            border: 1px solid #e0d6c0;
            max-height: 320px;
            overflow-y: auto;
        }
        .preview-image { max-width: 100%; border-radius: 12px; display: block; margin: 0 auto; }
        .preview-text { white-space: pre-wrap; font-family: monospace; background: #f8f9fa; padding: 12px; border-radius: 12px; font-size: 0.8rem; }
        .empty-media-modal { text-align: center; padding: 32px 20px; color: #a0a090; }
        .download-link-modal {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 14px;
            background: #8b5a2b;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 0.75rem;
        }

        .stat-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .stat-table th { background: #8b5a2b; color: white; padding: 10px 8px; text-align: left; }
        .stat-table td { padding: 8px 8px; border-bottom: 1px solid #e0d6c0; }
        .stat-table tr:hover { background: #f0e8d8; }
        .stat-table .num { text-align: right; padding-right: 16px; }
        .stat-name { font-weight: 500; color: #4a2a0a; cursor: pointer; }
        .stat-name:hover { color: #c07830; background-color: #f0e8d8; border-radius: 4px; }
        .stat-empty { text-align: center; color: #999; padding: 30px 0; }
        #statModal .modal-body { padding: 12px 20px; }
        .stat-summary { background: #f0e8d8; border-radius: 20px; padding: 8px 16px; margin-bottom: 16px; display: inline-block; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📂 共享资料系统</h1>
        <p>单击姓名查看多媒体资料 | 拖拽缩放 | 资料统计</p>
    </div>
    <div class="content">
        <div class="folder-select-area">
            <span class="folder-status" id="folderStatus">📁 正在检测运行环境...</span>
            <button class="folder-btn" id="selectFolderBtn">📂 加载资料库</button>
        </div>
        <div class="input-area">
            <input type="text" id="startName" placeholder="请输入姓名" value="冯宗德" disabled>
            <button id="statBtn" class="stat-btn" disabled>📊 资料统计</button>
        </div>
        <div class="output" id="output"><pre>请先点击「加载资料库」授权家谱数据...</pre></div>
    </div>
    <div class="footer">共享资料系统 | 点击姓名弹窗查看资料 | 线上模式自动加载 GitHub 资料</div>
</div>
<div class="to-top" id="toTopBtn" style="display: none;">↑</div>

<div id="mediaModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">📁 多媒体资料</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"><div class="empty-media-modal">加载中...</div></div>
    </div>
</div>

<div id="statModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3>📊 资料统计 · 按资料数排序</h3>
            <button class="modal-close" id="closeStatModalBtn">&times;</button>
        </div>
        <div class="modal-body" id="statModalBody">
            <div class="stat-empty">正在统计...</div>
        </div>
    </div>
</div>

<script>
// ===================== 全局变量 =====================
let peopleData = null;
let dataLoaded = false;
let rootHandle = null;
let folderHandle = null;
let manifestCache = null;
const isOnline = window.location.protocol === 'https:';
const GITHUB_BASE = 'https://fengzd45.github.io/codex1/%E8%B5%84%E6%96%99/';

// ===================== Person类 =====================
class Person {
    constructor(data) {
        this.name = data.n;
        this.sex = data.s;
        this.father = data.f || "";
        this.mother = data.m || "";
        this.spouse = data.sp || [];
        this.info = data.info || "";
        this.birthYear = this._extractYear(this.info);
        this.parents = [];
        this.children = [];
        this.fatherObj = null;
        this.motherObj = null;
    }
    _extractYear(info) {
        if (!info) return null;
        const match = info.match(/(1[0-9]{3}|20[0-9]{2})/);
        return match ? parseInt(match[0]) : null;
    }
}
function buildRelations(people) {
    for (const p of Object.values(people)) {
        if (p.father && people[p.father]) {
            p.fatherObj = people[p.father];
            p.parents.push(p.fatherObj);
            p.fatherObj.children.push(p);
        }
        if (p.mother && people[p.mother]) {
            p.motherObj = people[p.mother];
            p.parents.push(p.motherObj);
            p.motherObj.children.push(p);
        }
    }
    for (const p of Object.values(people)) {
        p.children.sort((a,b) => (a.birthYear ?? 9999) - (b.birthYear ?? 9999));
    }
    return people;
}
function parseJsonl(text) {
    const lines = text.split(/\r?\n/);
    const people = {};
    for (const line of lines) {
        if (!line.trim()) continue;
        try {
            const obj = JSON.parse(line);
            const p = new Person(obj);
            people[p.name] = p;
        } catch(e) { console.warn("解析失败:", line, e); }
    }
    return buildRelations(people);
}
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

// ===================== 多媒体 =====================
async function loadManifest() {
    if (manifestCache) return manifestCache;
    try {
        const resp = await fetch('https://fengzd45.github.io/codex1/manifest.json');
        if (resp.ok) {
            manifestCache = await resp.json();
            return manifestCache;
        }
    } catch(e) {}
    return null;
}
async function listOnlineFiles(personName) {
    const manifest = await loadManifest();
    if (manifest && manifest[personName]) {
        return manifest[personName].map(fname => ({ name: fname, url: `${GITHUB_BASE}${encodeURIComponent(personName)}/${encodeURIComponent(fname)}` }));
    }
    return [];
}
async function previewOnlineFile(url, fileName) {
    const ext = fileName.split('.').pop().toLowerCase();
    if (['jpg','jpeg','png','gif','webp'].includes(ext)) {
        return `<div><img src="${url}" style="max-height:280px;"><br><a href="${url}" download>下载</a></div>`;
    } else if (['mp4','webm'].includes(ext)) {
        return `<video controls src="${url}"></video><br><a href="${url}" download>下载</a>`;
    } else if (['mp3','wav'].includes(ext)) {
        return `<audio controls src="${url}"></audio><br><a href="${url}" download>下载</a>`;
    } else if (ext === 'txt') {
        try {
            const resp = await fetch(url);
            let text = await resp.text();
            let linkified = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
            return `<div class="preview-text">${linkified}</div><br><a href="${url}" download>下载文件</a>`;
        } catch(e) {
            return `<a href="${url}" download>下载 ${fileName}</a>`;
        }
    } else {
        return `<a href="${url}" download>下载 ${fileName}</a>`;
    }
}
async function previewLocalFile(file, fileName) {
    const url = URL.createObjectURL(file);
    const ext = fileName.split('.').pop().toLowerCase();
    let html = '';
    if (['jpg','jpeg','png','gif','webp'].includes(ext)) {
        html = `<div><img src="${url}" style="max-height:280px;"><br><a href="${url}" download>下载</a></div>`;
    } else if (['mp4','webm'].includes(ext)) {
        html = `<video controls src="${url}"></video><br><a href="${url}" download>下载</a>`;
    } else if (['mp3','wav'].includes(ext)) {
        html = `<audio controls src="${url}"></audio><br><a href="${url}" download>下载</a>`;
    } else if (ext === 'txt') {
        try {
            let text = await file.text();
            let linkified = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
            html = `<div class="preview-text">${linkified}</div><br><a href="${url}" download>下载文件</a>`;
        } catch(e) {
            html = `<a href="${url}" download>下载 ${fileName}</a>`;
        }
    } else {
        html = `<a href="${url}" download>下载 ${fileName}</a>`;
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return html;
}

const folderStatusSpan = document.getElementById('folderStatus');
const outputPre = document.getElementById('output');
const modalMedia = document.getElementById('mediaModal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const closeModalBtn = document.getElementById('closeModalBtn');
const selectFolderBtn = document.getElementById('selectFolderBtn');
const statModal = document.getElementById('statModal');
const statBody = document.getElementById('statModalBody');

// ===================== 授权 =====================
selectFolderBtn.onclick = async () => {
    if (isOnline) {
        folderStatusSpan.innerHTML = `🌐 线上模式：资料自动从 GitHub 加载，无需授权。`;
        folderStatusSpan.style.color = '#2c5a2c';
        return;
    }
    try {
        folderStatusSpan.innerHTML = '📂 请在弹窗中选择包含 family_data.jsonl 和「资料」文件夹的目录';
        rootHandle = await window.showDirectoryPicker();
        let foundJsonl = false;
        let foundData = false;
        let jsonlContent = '';

        try {
            const fileHandle = await rootHandle.getFileHandle('family_data.jsonl');
            const file = await fileHandle.getFile();
            jsonlContent = await file.text();
            const parsed = parseJsonl(jsonlContent);
            if (Object.keys(parsed).length > 0) {
                peopleData = parsed;
                dataLoaded = true;
                foundJsonl = true;
            }
        } catch (e) {
            console.warn('读取 family_data.jsonl 失败:', e);
        }

        try {
            const fileHandle = await rootHandle.getFileHandle('manifest.json');
            const file = await fileHandle.getFile();
            const text = await file.text();
            manifestCache = JSON.parse(text);
            console.log('✅ 找到 manifest.json');
        } catch (e) {
            console.log('📭 根目录下没有 manifest.json');
        }

        let foundFolder = null;
        for await (const entry of rootHandle.values()) {
            if (entry.kind === 'directory' && entry.name === '资料') {
                foundFolder = entry;
                break;
            }
        }
        if (foundFolder) {
            folderHandle = foundFolder;
            foundData = true;
        }

        if (foundJsonl && foundData) {
            folderStatusSpan.innerHTML = `✅ 成功加载 family_data.jsonl（${Object.keys(peopleData).length} 人）并授权「资料」文件夹。`;
            folderStatusSpan.style.color = '#2c5a2c';
            enableUI();
            outputPre.innerHTML = `<pre>✅ 家谱数据已加载！共 ${Object.keys(peopleData).length} 位人物。<br>已授权「资料」文件夹，点击姓名可查看多媒体资料。</pre>`;
            if (peopleData['冯宗德']) document.getElementById('startName').value = '冯宗德';
            else {
                const first = Object.keys(peopleData)[0] || '';
                document.getElementById('startName').value = first;
            }
        } else if (foundJsonl && !foundData) {
            folderStatusSpan.innerHTML = `✅ 加载 family_data.jsonl 成功（${Object.keys(peopleData).length} 人），但未找到「资料」文件夹。`;
            folderStatusSpan.style.color = '#c00';
            enableUI();
            outputPre.innerHTML = `<pre>✅ 家谱数据已加载！共 ${Object.keys(peopleData).length} 位人物。<br>⚠️ 未找到「资料」文件夹。</pre>`;
        } else {
            folderStatusSpan.innerHTML = `❌ 未找到 family_data.jsonl 或「资料」文件夹。`;
            folderStatusSpan.style.color = '#c00';
        }
    } catch (err) {
        if (err.name !== 'AbortError') console.error(err);
        folderStatusSpan.innerHTML = '⚠️ 未选择文件夹或授权失败';
        folderStatusSpan.style.color = '#c00';
    }
};

// ===================== 显示多媒体（懒加载优化版） =====================
async function showPersonMediaInModal(personName) {
    modalTitle.innerHTML = `📁 ${escapeHtml(personName)} 的资料`;
    modalBody.innerHTML = `<div class="empty-media-modal">⏳ 正在加载 ${escapeHtml(personName)} 的资料...</div>`;
    modalMedia.classList.add('active');

    if (isOnline) {
        const files = await listOnlineFiles(personName);
        if (files.length === 0) {
            modalBody.innerHTML = `<div class="empty-media-modal">📭 该人物暂无线上资料文件。</div>`;
            return;
        }
        let listHtml = `<div class="file-list-modal">`;
        for (const f of files) {
            listHtml += `<div class="file-item-modal" data-url="${escapeHtml(f.url)}" data-name="${escapeHtml(f.name)}"><span class="file-icon-modal">📄</span><span class="file-name-modal">${escapeHtml(f.name)}</span></div>`;
        }
        listHtml += `</div><div id="onlinePreviewArea" class="media-preview-modal"><div class="empty-media-modal">点击上方文件预览</div></div>`;
        modalBody.innerHTML = listHtml;
        const previewDiv = document.getElementById('onlinePreviewArea');
        document.querySelectorAll('.file-item-modal').forEach(el => {
            const url = el.getAttribute('data-url');
            const name = el.getAttribute('data-name');
            el.onclick = async () => {
                if (previewDiv) previewDiv.innerHTML = await previewOnlineFile(url, name);
            };
        });
        if (files[0] && previewDiv) previewDiv.innerHTML = await previewOnlineFile(files[0].url, files[0].name);
        return;
    }

    if (!folderHandle && !rootHandle) {
        modalBody.innerHTML = `<div class="empty-media-modal">⚠️ 请先点击「加载资料库」按钮，授权「资料」文件夹</div>`;
        return;
    }

    let targetDir = null;
    if (folderHandle) {
        try {
            targetDir = await folderHandle.getDirectoryHandle(personName);
        } catch (e) {
            if (rootHandle) {
                try {
                    const dataDir = await rootHandle.getDirectoryHandle('资料');
                    targetDir = await dataDir.getDirectoryHandle(personName);
                } catch (e2) {}
            }
        }
    } else if (rootHandle) {
        try {
            const dataDir = await rootHandle.getDirectoryHandle('资料');
            targetDir = await dataDir.getDirectoryHandle(personName);
        } catch (e) {}
    }

    if (!targetDir) {
        modalBody.innerHTML = `<div class="empty-media-modal">❌ 找不到“${escapeHtml(personName)}”的资料文件夹。</div>`;
        return;
    }

    let fileNames = [];
    if (manifestCache && manifestCache[personName]) {
        fileNames = manifestCache[personName];
    } else {
        const manifest = await loadLocalManifest();
        if (manifest && manifest[personName]) {
            fileNames = manifest[personName];
            manifestCache = manifest;
        }
    }

    if (fileNames.length === 0) {
        for await (const entry of targetDir.values()) {
            if (entry.kind === 'file') {
                fileNames.push(entry.name);
            }
        }
    }

    if (fileNames.length === 0) {
        modalBody.innerHTML = `<div class="empty-media-modal">📭 该人物暂无本地资料文件。</div>`;
        return;
    }

    fileNames.sort((a,b) => a.localeCompare(b));
    let listHtml = `<div class="file-list-modal">`;
    for (const fname of fileNames) {
        const ext = fname.split('.').pop().toLowerCase();
        const icon = ['jpg','jpeg','png','gif','webp'].includes(ext) ? '🖼️' :
                     ['mp4','webm','avi','mov'].includes(ext) ? '🎬' :
                     ['mp3','wav','flac'].includes(ext) ? '🎵' : '📄';
        listHtml += `<div class="file-item-modal" data-filename="${escapeHtml(fname)}"><span class="file-icon-modal">${icon}</span><span class="file-name-modal">${escapeHtml(fname)}</span></div>`;
    }
    listHtml += `</div><div id="localPreviewArea" class="media-preview-modal"><div class="empty-media-modal">点击上方文件预览</div></div>`;
    modalBody.innerHTML = listHtml;

    const previewDiv = document.getElementById('localPreviewArea');
    document.querySelectorAll('.file-item-modal').forEach(el => {
        const fname = el.getAttribute('data-filename');
        el.onclick = async () => {
            if (previewDiv) {
                previewDiv.innerHTML = '<div class="empty-media-modal">⏳ 加载中...</div>';
                try {
                    const fileHandle = await targetDir.getFileHandle(fname);
                    const file = await fileHandle.getFile();
                    previewDiv.innerHTML = await previewLocalFile(file, fname);
                } catch (e) {
                    previewDiv.innerHTML = `<div class="empty-media-modal">❌ 读取失败: ${e.message}</div>`;
                }
            }
        };
    });

    if (fileNames[0] && previewDiv) {
        try {
            const fileHandle = await targetDir.getFileHandle(fileNames[0]);
            const file = await fileHandle.getFile();
            previewDiv.innerHTML = await previewLocalFile(file, fileNames[0]);
        } catch (e) {
            previewDiv.innerHTML = `<div class="empty-media-modal">点击文件预览</div>`;
        }
    }
}

// ===================== 关闭逻辑 =====================
closeModalBtn.onclick = function() {
    modalMedia.classList.remove('active');
};
modalMedia.addEventListener('click', (e) => {
    if (e.target === modalMedia) {
        modalMedia.classList.remove('active');
    }
});

// ===================== 资料统计 =====================
async function loadLocalManifest() {
    if (!rootHandle) return null;
    try {
        const fileHandle = await rootHandle.getFileHandle('manifest.json');
        const file = await fileHandle.getFile();
        const text = await file.text();
        return JSON.parse(text);
    } catch (e) {
        return null;
    }
}

async function buildManifest() {
    if (!rootHandle) return null;
    const manifest = {};
    try {
        let dataDir = null;
        for await (const entry of rootHandle.values()) {
            if (entry.kind === 'directory' && entry.name === '资料') {
                dataDir = entry;
                break;
            }
        }
        if (!dataDir) return null;

        for await (const entry of dataDir.values()) {
            if (entry.kind === 'directory') {
                const personName = entry.name;
                const files = [];
                try {
                    const personDir = await dataDir.getDirectoryHandle(personName);
                    for await (const fileEntry of personDir.values()) {
                        if (fileEntry.kind === 'file') {
                            files.push(fileEntry.name);
                        }
                    }
                    if (files.length > 0) {
                        manifest[personName] = files;
                    }
                } catch (e) {
                    // 跳过无法读取的目录
                }
            }
        }
    } catch (e) {
        console.warn('生成 manifest 失败:', e);
        return null;
    }
    return manifest;
}

async function saveManifest(manifest) {
    if (!rootHandle) return false;
    try {
        const json = JSON.stringify(manifest, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        try {
            let fileHandle;
            try {
                fileHandle = await rootHandle.getFileHandle('manifest.json');
            } catch (e) {
                fileHandle = await rootHandle.getFileHandle('manifest.json', { create: true });
            }
            const writable = await fileHandle.createWritable();
            await writable.write(blob);
            await writable.close();
            console.log('✅ manifest.json 已保存到根目录');
            return true;
        } catch (e) {
            console.warn('使用 File System API 保存失败，降级为下载:', e);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'manifest.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            return true;
        }
    } catch (e) {
        console.error('保存 manifest.json 失败:', e);
        return false;
    }
}

async function showStatModal() {
    statBody.innerHTML = '<div class="stat-empty">⏳ 正在统计资料，请稍候...</div>';
    statModal.classList.add('active');

    try {
        let stats = [];
        const names = Object.keys(peopleData || {});
        if (names.length === 0) {
            statBody.innerHTML = '<div class="stat-empty">⚠️ 家谱数据未加载，请先加载资料库。</div>';
            return;
        }

        if (isOnline) {
            statBody.innerHTML = '<div class="stat-empty">🌐 线上模式，从 GitHub 加载 manifest...</div>';
            try {
                const resp = await fetch('https://fengzd45.github.io/codex1/manifest.json');
                if (resp.ok) {
                    const manifest = await resp.json();
                    const nameSet = new Set(names);
                    for (const [name, files] of Object.entries(manifest)) {
                        if (!nameSet.has(name)) continue;
                        if (files.length === 0) continue;
                        let txtCount = 0, imgCount = 0, vidCount = 0;
                        for (const fname of files) {
                            const ext = fname.split('.').pop().toLowerCase();
                            if (['txt', 'md', 'json'].includes(ext)) txtCount++;
                            else if (['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext)) imgCount++;
                            else if (['mp4','webm','avi','mov','mp3','wav','flac','aac'].includes(ext)) vidCount++;
                            else txtCount++;
                        }
                        stats.push({ name, txt: txtCount, img: imgCount, vid: vidCount, total: files.length });
                    }
                } else {
                    throw new Error('manifest.json 不存在');
                }
            } catch (e) {
                statBody.innerHTML = `<div class="stat-empty">❌ 线上模式需要 manifest.json，请先运行 build_manifest.py 生成并推送。</div>`;
                return;
            }
        } else {
            if (!rootHandle) {
                statBody.innerHTML = '<div class="stat-empty">⚠️ 请先点击「加载资料库」授权文件夹。</div>';
                return;
            }

            let manifest = await loadLocalManifest();
            
            if (!manifest || Object.keys(manifest).length === 0) {
                statBody.innerHTML = '<div class="stat-empty">📂 未找到 manifest.json，正在自动生成...</div>';
                
                manifest = await buildManifest();
                
                if (!manifest || Object.keys(manifest).length === 0) {
                    statBody.innerHTML = '<div class="stat-empty">❌ 未找到任何资料文件。<br>请确保「资料」文件夹下有人物子文件夹。</div>';
                    return;
                }

                const saved = await saveManifest(manifest);
                if (saved) {
                    statBody.innerHTML = '<div class="stat-empty">✅ 已自动生成 manifest.json 并保存到根目录。</div>';
                } else {
                    statBody.innerHTML = '<div class="stat-empty">⚠️ manifest.json 生成成功，但保存失败。<br>请手动将下载的文件放到根目录。</div>';
                }
            }

            const nameSet = new Set(names);
            for (const [name, files] of Object.entries(manifest)) {
                if (!nameSet.has(name)) continue;
                if (files.length === 0) continue;
                let txtCount = 0, imgCount = 0, vidCount = 0;
                for (const fname of files) {
                    const ext = fname.split('.').pop().toLowerCase();
                    if (['txt', 'md', 'json'].includes(ext)) txtCount++;
                    else if (['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext)) imgCount++;
                    else if (['mp4','webm','avi','mov','mp3','wav','flac','aac'].includes(ext)) vidCount++;
                    else txtCount++;
                }
                stats.push({ name, txt: txtCount, img: imgCount, vid: vidCount, total: files.length });
            }
        }

        stats.sort((a,b) => b.total - a.total);

        if (stats.length === 0) {
            statBody.innerHTML = '<div class="stat-empty">📭 暂未找到任何有资料的人物。</div>';
            return;
        }

        let html = `<div class="stat-summary">📊 共 ${stats.length} 位人物有资料，总文件数 ${stats.reduce((s,o) => s + o.total, 0)}</div>`;
        html += `<table class="stat-table"><thead><tr><th>姓名</th><th class="num">📄 文章</th><th class="num">🖼️ 图片</th><th class="num">🎵 音视频</th><th class="num">📦 合计</th></tr></thead><tbody>`;
        for (const s of stats) {
            html += `<tr><td><span class="clickable-name" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span></td><td class="num">${s.txt}</td><td class="num">${s.img}</td><td class="num">${s.vid}</td><td class="num"><strong>${s.total}</strong></td></tr>`;
        }
        html += `</tbody></table>`;
        statBody.innerHTML = html;

        statBody.querySelectorAll('.clickable-name').forEach(el => {
            el.onclick = function(e) {
                e.stopPropagation();
                e.preventDefault();
                const name = this.getAttribute('data-name');
                if (name && peopleData[name]) {
                    showPersonMediaInModal(name);
                }
                return false;
            };
        });

    } catch (err) {
        console.error(err);
        statBody.innerHTML = `<div class="stat-empty">❌ 统计失败: ${err.message}</div>`;
    }
}

async function tryAutoLoad() {
    if (window.location.protocol === 'file:') {
        folderStatusSpan.innerHTML = `📁 请点击「加载资料库」选择包含 family_data.jsonl 的文件夹。`;
        folderStatusSpan.style.color = '#8b5a2b';
        outputPre.innerHTML = `<pre>⏳ 请点击上方「加载资料库」按钮，选择包含 family_data.jsonl 及「资料」子文件夹的目录。</pre>`;
        return;
    }
    if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        try {
            const resp = await fetch('family_data.jsonl');
            if (resp.ok) {
                const text = await resp.text();
                const parsed = parseJsonl(text);
                if (Object.keys(parsed).length > 0) {
                    peopleData = parsed;
                    dataLoaded = true;
                    enableUI();
                    folderStatusSpan.innerHTML = `✅ 自动加载成功！共 ${Object.keys(peopleData).length} 位人物。`;
                    folderStatusSpan.style.color = '#2c5a2c';
                    outputPre.innerHTML = `<pre>✅ 自动加载 family_data.jsonl 成功！共 ${Object.keys(peopleData).length} 位人物。<br>如需多媒体资料，请点击「加载资料库」授权「资料」文件夹。</pre>`;
                    if (peopleData['冯宗德']) document.getElementById('startName').value = '冯宗德';
                    else {
                        const first = Object.keys(peopleData)[0] || '';
                        document.getElementById('startName').value = first;
                    }
                    return;
                }
            }
        } catch(e) {
            console.warn("自动加载失败，降级至手动授权");
        }
    }
    folderStatusSpan.innerHTML = `📁 请点击「加载资料库」选择包含 family_data.jsonl 的文件夹。`;
    folderStatusSpan.style.color = '#8b5a2b';
    outputPre.innerHTML = `<pre>⏳ 未检测到 family_data.jsonl。<br><br>请点击上方「加载资料库」按钮，选择包含该文件及「资料」子文件夹的目录。</pre>`;
}

if (isOnline) {
    tryAutoLoad();
    folderStatusSpan.innerHTML = `🌐 线上模式（GitHub Pages）· 资料自动加载，无需授权`;
    selectFolderBtn.textContent = '📂 线上模式已启用';
    selectFolderBtn.disabled = true;
    selectFolderBtn.style.opacity = '0.6';
    selectFolderBtn.style.cursor = 'default';
    loadManifest();
} else {
    tryAutoLoad();
}

<script src="https://unpkg.com/pinyin-pro"></script>
<script>
// ==================== 配置 ====================
const AGENT_CONFIG = {
  workerUrl: 'https://family-ai-proxy.fengzd8.workers.dev',
  enabled: true,
  timeout: 30000,
  maxSteps: 10
};

// ==================== 数据模型 ====================
class Person {
  constructor(d) {
    this.name = d.n; this.sex = d.s; this.father = d.f || ""; this.mother = d.m || "";
    this.spouse = d.sp || []; this.info = d.info || ""; this.birthYear = this._y(d.info);
    this.parents = []; this.children = []; this.fatherObj = null; this.motherObj = null;
  }
  _y(info) { const m = info && info.match(/(1[0-9]{3}|20[0-9]{2})/); return m ? parseInt(m[0]) : null; }
}
function buildRelations(people) {
  for (const p of Object.values(people)) {
    if (p.father && people[p.father]) { p.fatherObj = people[p.father]; p.parents.push(p.fatherObj); p.fatherObj.children.push(p); }
    if (p.mother && people[p.mother]) { p.motherObj = people[p.mother]; p.parents.push(p.motherObj); p.motherObj.children.push(p); }
  }
  for (const p of Object.values(people)) p.children.sort((a,b)=>(a.birthYear??9999)-(b.birthYear??9999));
  return people;
}
function parseJsonl(text) {
  const people = {};
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    try { const obj = JSON.parse(line); const p = new Person(obj); people[p.name] = p; } catch(e){}
  }
  return buildRelations(people);
}
function escapeHtml(s) { return !s ? '' : s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

// ==================== 关系称谓别名表（★ 本次新增）====================
const RELATION_ALIASES = {
  '爸爸':'父亲','爸':'父亲','爹':'父亲','老爸':'父亲','家父':'父亲',
  '妈妈':'母亲','妈':'母亲','娘':'母亲','老妈':'母亲','家母':'母亲',
  '老婆':'配偶','妻子':'配偶','老公':'配偶','丈夫':'配偶',
  '爷爷':'祖父','阿公':'祖父','奶奶':'祖母','阿嬷':'祖母',
  '外公':'外祖父','姥爷':'外祖父','外婆':'外祖母','姥姥':'外祖母',
  '舅舅':'舅父','舅':'舅父',
  '舅妈':'舅母','舅母':'舅母',
  '姨妈':'姨母','姨':'姨母','姨娘':'姨母',
  '姨丈':'姨父','姨父':'姨父',
  '姑姑':'姑母','姑妈':'姑母','姑':'姑母',
  '叔叔':'叔父','叔':'叔父',
  '伯伯':'伯父','大伯':'伯父','大爷':'伯父',
  '哥哥':'兄','哥':'兄','大哥':'兄',
  '弟弟':'弟',
  '姐姐':'姐','姐':'姐',
  '妹妹':'妹','妹':'妹',
  '儿媳妇':'儿媳','媳妇':'儿媳',
  '姑爷':'女婿',
  '侄子':'侄子','侄儿':'侄子','侄女':'侄女',
  '外甥':'外甥','外甥女':'外甥女',
  '孙子':'孙子','孙':'孙子','孙女':'孙女',
  '曾孙':'曾孙','重孙':'曾孙','曾孙女':'曾孙女','重孙女':'曾孙女',
};

const RELATION_AMBIGUOUS = {
  '表哥':['姑表兄','舅表兄','姨表兄'],
  '表兄':['姑表兄','舅表兄','姨表兄'],
  '表弟':['姑表弟','舅表弟','姨表弟'],
  '表姐':['姑表姐','舅表姐','姨表姐'],
  '表妹':['姑表妹','舅表妹','姨表妹'],
  '表兄弟':['姑表兄弟','舅表兄弟','姨表兄弟','姑表兄','姑表弟','舅表兄','舅表弟','姨表兄','姨表弟'],
  '表姐妹':['姑表姐妹','舅表姐妹','姨表姐妹','姑表姐','姑表妹','舅表姐','舅表妹','姨表姐','姨表妹'],
  '堂哥':['堂兄'],'堂弟':['堂弟'],'堂姐':['堂姐'],'堂妹':['堂妹'],
  '堂兄弟':['堂兄','堂弟','堂兄弟'],
  '堂姐妹':['堂姐','堂妹','堂姐妹'],
};

function resolveRelationCandidates(term) {
  term = (term || '').trim();
  if (!term) return [];
  if (RELATION_AMBIGUOUS[term]) return RELATION_AMBIGUOUS[term];
  if (RELATION_ALIASES[term]) return [RELATION_ALIASES[term]];
  return [term];
}

// ==================== 工具实现 ====================
function toolFindPerson(query) {
  if (!query || !peopleData) return { ok: false, error: '缺少查询参数' };
  query = String(query).trim();
  if (peopleData[query]) return { ok: true, matches: [query], note: '精确匹配' };
  try {
    const qp = pinyinPro.pinyin(query, { toneType: 'none', type: 'array' }).join('').toLowerCase();
    const matches = [];
    for (const name of Object.keys(peopleData)) {
      const np = pinyinPro.pinyin(name, { toneType: 'none', type: 'array' }).join('').toLowerCase();
      if (np === qp || np.includes(qp) || qp.includes(np)) matches.push(name);
    }
    if (matches.length) return { ok: true, matches, note: '拼音匹配' };
  } catch(e) {}
  return { ok: false, error: `未找到与"${query}"匹配的人`, matches: [] };
}

function toolGetPersonInfo(name) {
  const p = peopleData[name];
  if (!p) return { ok: false, error: `"${name}" 不在家谱中` };
  return {
    ok: true, name: p.name, sex: p.sex, birthYear: p.birthYear,
    father: p.father || null, mother: p.mother || null,
    spouse: p.spouse.slice(), children: p.children.map(c => c.name), info: p.info || ''
  };
}

function toolGetRelatives(name, type) {
  const p = peopleData[name];
  if (!p) return { ok: false, error: `"${name}" 不在家谱中` };
  const map = {
    father: () => p.fatherObj ? [p.fatherObj.name] : [],
    mother: () => p.motherObj ? [p.motherObj.name] : [],
    spouse: () => p.spouse.slice(),
    sons: () => p.children.filter(c => c.sex === '男').map(c => c.name),
    daughters: () => p.children.filter(c => c.sex === '女').map(c => c.name),
    children: () => p.children.map(c => c.name),
    older_brothers: () => siblings(p).filter(s => s.sex === '男' && cmpBirth(p, s) < 0).map(s => s.name),
    younger_brothers: () => siblings(p).filter(s => s.sex === '男' && cmpBirth(p, s) > 0).map(s => s.name),
    older_sisters: () => siblings(p).filter(s => s.sex === '女' && cmpBirth(p, s) < 0).map(s => s.name),
    younger_sisters: () => siblings(p).filter(s => s.sex === '女' && cmpBirth(p, s) > 0).map(s => s.name),
    siblings: () => siblings(p).map(s => s.name)
  };
  if (!map[type]) return { ok: false, error: `不支持的亲属类型：${type}` };
  const list = map[type]();
  return { ok: true, name, relation_type: type, count: list.length, relatives: list };
}
function siblings(p) {
  const m = new Map();
  if (p.fatherObj) for (const c of p.fatherObj.children) if (c.name !== p.name) m.set(c.name, c);
  if (p.motherObj) for (const c of p.motherObj.children) if (c.name !== p.name) m.set(c.name, c);
  return [...m.values()];
}
function cmpBirth(a, b) {
  if (a.birthYear !== null && b.birthYear !== null) return b.birthYear - a.birthYear;
  return 0;
}

function bfsRelationships(startName) {
  const start = peopleData[startName];
  if (!start) return {};
  const visited = {};
  const queue = [{ person: start, pathPersons: [], pathOps: [] }];
  while (queue.length) {
    const { person: cur, pathPersons, pathOps } = queue.shift();
    if (visited[cur.name]) continue;
    visited[cur.name] = { pathPersons: [...pathPersons], pathOps: [...pathOps], person: cur };
    if (cur.fatherObj) queue.push({ person: cur.fatherObj, pathPersons: [...pathPersons, cur.fatherObj], pathOps: [...pathOps, 'f'] });
    if (cur.motherObj) queue.push({ person: cur.motherObj, pathPersons: [...pathPersons, cur.motherObj], pathOps: [...pathOps, 'm'] });
    for (const c of cur.children) queue.push({ person: c, pathPersons: [...pathPersons, c], pathOps: [...pathOps, 'ch'] });
    for (const sp of cur.spouse) if (peopleData[sp]) queue.push({ person: peopleData[sp], pathPersons: [...pathPersons, peopleData[sp]], pathOps: [...pathOps, 'sp'] });
  }
  return visited;
}

const SPOUSE_MAP = new Map();
[
  ["兄","男","嫂"],["弟","男","弟媳"],["姐","女","姐夫"],["妹","女","妹夫"],
  ["伯父","男","伯母"],["叔父","男","叔母"],["姑母","女","姑父"],
  ["舅父","男","舅母"],["姨母","女","姨父"],
  ["祖父","男","祖母"],["祖母","女","祖父"],["外祖父","男","外祖母"],["外祖母","女","外祖父"],
  ["曾祖父","男","曾祖母"],["曾祖母","女","曾祖父"],
  ["儿子","男","儿媳"],["女儿","女","女婿"],
  ["孙子","男","孙媳"],["孙女","女","孙女婿"],
  ["侄子","男","侄媳"],["侄女","女","侄女婿"],
  ["外甥","男","外甥媳"],["外甥女","女","外甥女婿"],
  ["亲家公","男","亲家母"],["亲家母","女","亲家公"],
  ["兄弟","男","兄弟的配偶"],["姐妹","女","姐妹的配偶"]
].forEach(([r,s,sp]) => SPOUSE_MAP.set(r+'|'+s, sp));

function getSpouseWithPrefix(rel, sex) {
  const prefixes = ["堂","姑表","舅表","姨表","姻","内","亲家","外","岳","夫家","妻家","再从","族","远"];
  for (const pre of prefixes) {
    if (rel.startsWith(pre)) {
      const base = rel.slice(pre.length);
      if ((base === "兄弟" || base === "兄" || base === "弟") && sex === '男') return pre + "嫂";
      if ((base === "姐妹" || base === "姐" || base === "妹") && sex === '女') return pre + base + "夫";
      const key = base + '|' + sex;
      if (SPOUSE_MAP.has(key)) return pre + SPOUSE_MAP.get(key);
      const sub = getSpouseWithPrefix(base, sex);
      if (sub) return pre + sub;
    }
  }
  return null;
}

function getRelationship(start, target, pathPersons, ops) {
  const up = ops.filter(o => o === 'f' || o === 'm').length;
  const down = ops.filter(o => o === 'ch').length;
  const sp = ops.filter(o => o === 'sp').length;
  if (ops.length === 1 && ops[0] === 'sp') return "配偶";
  if (ops.length === 2 && ops[0] === 'ch' && ops[1] === 'sp') {
    const child = pathPersons[0];
    return child ? (child.sex === '男' ? (target.sex === '女' ? "儿媳" : "女婿") : (target.sex === '男' ? "女婿" : "儿媳")) : (target.sex === '女' ? "儿媳" : "女婿");
  }
  if (ops.length >= 3 && ops[0]==='ch' && ops[1]==='sp' && (ops[2]==='f' || ops[2]==='m'))
    return "亲家" + getRelationship(start, target, pathPersons.slice(2), ops.slice(2));
  if (ops.length && ops[0] === 'sp' && sp === 1 && down === 0) {
    const spouse = pathPersons[0];
    if (!spouse) return "未知";
    const relFromSpouse = getRelationship(spouse, target, pathPersons.slice(1), ops.slice(1));
    if (start.sex === '男') return spouse.sex === '女' ? (ops[1] === 'm' ? "外岳" + relFromSpouse : "岳" + relFromSpouse) : "岳" + relFromSpouse;
    if (spouse.sex === '男') {
      if (relFromSpouse.includes("父")) return relFromSpouse.replace("父","公");
      if (relFromSpouse.includes("母")) return relFromSpouse.replace("母","婆");
      return "夫家" + relFromSpouse;
    }
    return "妻家" + relFromSpouse;
  }
  if (ops.length && ops[0] === 'sp' && up === 1 && down === 1) {
    const diff = cmpBirth(pathPersons[0], target);
    if (diff < 0) return target.sex === '男' ? "姻兄" : "姻姐";
    return target.sex === '男' ? (diff > 0 ? "姻弟" : "姻兄弟") : (diff > 0 ? "姻妹" : "姻姐妹");
  }
  if (ops.length && ops[0] === 'sp' && sp === 1)
    return "姻" + getRelationship(start, target, pathPersons.slice(1), ops.slice(1));
  if (down === 0) {
    const allF = ops.every(o => o === 'f');
    if (up === 1) return target.sex === '男' ? "父亲" : "母亲";
    if (up === 2) return target.sex === '男' ? (allF ? "祖父" : "外祖父") : (allF ? "祖母" : "外祖母");
    if (up === 3) return target.sex === '男' ? (allF ? "曾祖父" : "外曾祖父") : (allF ? "曾祖母" : "外曾祖母");
    return (allF ? "远祖" : "外远祖") + (target.sex === '男' ? "" : "母");
  }
  if (up === 0) {
    const m = {1:["儿子","女儿"],2:["孙子","孙女"],3:["曾孙","曾孙女"],4:["玄孙","玄孙女"]};
    return m[down] ? (target.sex === '男' ? m[down][0] : m[down][1]) : (target.sex === '男' ? "远孙" : "远孙女");
  }
  if (up === 2 && down === 1) {
    if (ops.join('') === 'ffch') {
      const diff = cmpBirth(pathPersons[0], target);
      if (target.sex === '男') return diff < 0 ? "伯父" : (diff > 0 ? "叔父" : "伯叔");
      return "姑母";
    }
    return target.sex === '男' ? "舅父" : "姨母";
  }
  if (up === 1 && down === 2) {
    const sib = pathPersons[pathPersons.length-2];
    const sSex = sib ? sib.sex : (ops[0]==='f'?'男':'女');
    return sSex === '男' ? (target.sex === '男' ? "侄子" : "侄女") : (target.sex === '男' ? "外甥" : "外甥女");
  }
  if (ops[ops.length-1] === 'sp') {
    const basePerson = pathPersons[pathPersons.length-2];
    if (!basePerson) return "未知";
    const baseRel = getRelationship(start, basePerson, pathPersons.slice(0,-1), ops.slice(0,-1));
    const key = baseRel + '|' + basePerson.sex;
    if (SPOUSE_MAP.has(key)) return SPOUSE_MAP.get(key);
    const sp = getSpouseWithPrefix(baseRel, basePerson.sex);
    if (sp) return sp;
    if (baseRel.includes("兄")) return "姻" + baseRel.replace("兄","嫂");
    if (baseRel.includes("弟")) return "姻" + baseRel.replace("弟","媳");
    if (baseRel.includes("姐")) return "姻" + baseRel.replace("姐","夫");
    if (baseRel.includes("妹")) return "姻" + baseRel.replace("妹","夫");
    if (baseRel.includes("子")) return "姻" + baseRel.replace("子","媳");
    if (baseRel.includes("女")) return baseRel.includes("侄") ? "侄女婿" : (baseRel.includes("外甥") ? "外甥女婿" : baseRel + "婿");
    return "姻" + baseRel + "的配偶";
  }
  if (up === down) {
    if (up === 1) {
      const diff = cmpBirth(start, target);
      if (target.sex === '男') return diff < 0 ? "兄" : (diff > 0 ? "弟" : "兄弟");
      return diff < 0 ? "姐" : (diff > 0 ? "妹" : "姐妹");
    }
    let prefix = "";
    if (pathPersons.length > up) {
      const first = ops[0], connector = pathPersons[up];
      if (first === 'f') prefix = (connector.sex === '女') ? "姑表" : "堂";
      else if (first === 'm') prefix = (connector.sex === '男') ? "舅表" : "姨表";
    }
    const diff = cmpBirth(start, target);
    const suffix = target.sex === '男' ? (diff < 0 ? "兄" : (diff > 0 ? "弟" : "兄弟")) : (diff < 0 ? "姐" : (diff > 0 ? "妹" : "姐妹"));
    return prefix + suffix;
  }
  if (!ops.includes('sp')) {
    const diff = up - down, level = Math.min(up, down);
    let prefix = "";
    if (pathPersons.length > level) {
      const first = ops[0], connector = pathPersons[level];
      if (first === 'f') prefix = (connector.sex === '女') ? "姑表" : "堂";
      else if (first === 'm') prefix = (connector.sex === '男') ? "舅表" : "姨表";
    }
    let mod = level <= 1 ? "" : (level === 2 ? "堂" : (level === 3 ? "再从" : "远"));
    if (prefix) mod = "";
    if (diff > 0) {
      if (diff === 1) return prefix + mod + (ops[0]==='f' ? (target.sex==='男'?"伯叔":"姑") : (target.sex==='男'?"舅":"姨"));
      if (diff === 2) return prefix + mod + (target.sex==='男'?"祖父":"祖母");
      return prefix + mod + `${diff}辈长辈`;
    }
    const absDiff = -diff;
    const sib = pathPersons[pathPersons.length-2];
    const sSex = sib ? sib.sex : (ops[0]==='f'?'男':'女');
    if (absDiff === 1) return prefix + mod + (sSex==='男'?"侄":"甥") + (target.sex==='男'?"子":"女");
    return prefix + mod + `${absDiff}辈晚辈`;
  }
  return "未知关系";
}

function toolDescribeRelation(a, b) {
  if (!peopleData[a]) return { ok: false, error: `"${a}" 不在家谱中` };
  if (!peopleData[b]) return { ok: false, error: `"${b}" 不在家谱中` };
  if (a === b) return { ok: true, a, b, relation: '同一个人' };
  const rels = bfsRelationships(a);
  const info = rels[b];
  if (!info) return { ok: false, error: `未找到 "${a}" 与 "${b}" 之间可推导的路径` };
  const relation = getRelationship(peopleData[a], peopleData[b], info.pathPersons, info.pathOps);
  return { ok: true, a, b, relation, path: info.pathOps.join('→') };
}

function toolFindCommonAncestor(a, b) {
  if (!peopleData[a]) return { ok: false, error: `"${a}" 不在家谱中` };
  if (!peopleData[b]) return { ok: false, error: `"${b}" 不在家谱中` };
  const getAncestors = (name) => {
    const m = new Map(), q = [{ name, depth: 0 }];
    while (q.length) {
      const { name: cur, depth } = q.shift();
      if (m.has(cur)) continue;
      m.set(cur, depth);
      const p = peopleData[cur];
      if (p.fatherObj) q.push({ name: p.fatherObj.name, depth: depth + 1 });
      if (p.motherObj) q.push({ name: p.motherObj.name, depth: depth + 1 });
    }
    return m;
  };
  const ancA = getAncestors(a), ancB = getAncestors(b);
  const common = [];
  for (const [name, dA] of ancA.entries()) {
    if (ancB.has(name) && name !== a && name !== b) common.push({ name, dA, dB: ancB.get(name), total: dA + ancB.get(name) });
  }
  if (!common.length) return { ok: false, error: `${a} 和 ${b} 没有共同的祖先（或数据缺失）` };
  common.sort((x, y) => x.total - y.total);
  return { ok: true, a, b, nearest_ancestor: common[0].name, distance_from_a: common[0].dA, distance_from_b: common[0].dB, all_common: common.slice(0, 5).map(x => x.name) };
}

function executeTool(name, args) {
  try {
    switch (name) {
      case 'find_person': return toolFindPerson(args.query);
      case 'get_relatives': return toolGetRelatives(args.name, args.relation_type);
      case 'get_person_info': return toolGetPersonInfo(args.name);
      case 'describe_relation': return toolDescribeRelation(args.a, args.b);
      case 'find_common_ancestor': return toolFindCommonAncestor(args.a, args.b);
      default: return { ok: false, error: `未知工具：${name}` };
    }
  } catch (e) {
    return { ok: false, error: `工具执行失败：${e.message}` };
  }
}

// ==================== Agent 主循环 ====================
async function callAI(messages) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), AGENT_CONFIG.timeout);
  try {
    const resp = await fetch(AGENT_CONFIG.workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, tools: AGENT_TOOLS, tool_choice: 'required' }),
      signal: controller.signal
    });
    if (!resp.ok) { const t = await resp.text().catch(() => ''); throw new Error(`Worker ${resp.status}: ${t.slice(0, 200)}`); }
    return await resp.json();
  } finally { clearTimeout(timer); }
}

async function runAgent(userInput, onProgress) {
  const messages = [
    { role: 'system', content: AGENT_SYSTEM_PROMPT },
    { role: 'user', content: userInput }
  ];
  const steps = [];

  for (let step = 0; step < AGENT_CONFIG.maxSteps; step++) {
    onProgress && onProgress(`🤖 第 ${step + 1} 步：模型思考中...`);
    const data = await callAI(messages);
    const msg = data.choices && data.choices[0] && data.choices[0].message;
    if (!msg) throw new Error('模型返回格式异常');

    if (!msg.tool_calls || msg.tool_calls.length === 0) {
      return { ok: true, answer: msg.content || '(空)', steps };
    }

    const call = msg.tool_calls[0];
    const toolName = call.function.name;
    let args = {};
    try { args = JSON.parse(call.function.arguments || '{}'); } catch (e) {}

    if (toolName === 'finish_answer') return { ok: true, answer: args.answer || '(空)', steps };

    onProgress && onProgress(`🔧 第 ${step + 1} 步：调用 ${toolName}(${JSON.stringify(args)})`);
    const result = executeTool(toolName, args);
    steps.push({ tool: toolName, args, result });

    messages.push(msg);
    messages.push({ role: 'tool', tool_call_id: call.id, content: JSON.stringify(result) });
  }

  return { ok: false, error: `超过最大推理步数（${AGENT_CONFIG.maxSteps}）。`, steps };
}

function renderAgentResult(result) {
  let html = '';
  if (result.steps && result.steps.length) {
    const stepsHtml = result.steps.map((s, i) => {
      const args = JSON.stringify(s.args);
      let summary = '';
      if (s.result.ok === false) summary = `❌ ${s.result.error || '失败'}`;
      else if (s.result.matches) summary = `匹配到 ${s.result.matches.length} 人：${s.result.matches.slice(0, 5).join('、')}`;
      else if (s.result.relatives) summary = `找到 ${s.result.count} 人：${s.result.relatives.slice(0, 8).join('、')}`;
      else if (s.result.relation) summary = `关系：${s.result.relation}`;
      else if (s.result.nearest_ancestor) summary = `最近共同祖先：${s.result.nearest_ancestor}`;
      else if (s.result.name) summary = `已获取 ${s.result.name} 的信息`;
      else summary = '已返回数据';
      return `  第${i + 1}步: ${s.tool}(${escapeHtml(args)})\n       → ${escapeHtml(summary)}`;
    }).join('\n');
    html += `<div class="debug-banner">🧠 推理过程：\n${stepsHtml}</div>`;
  }

  if (result.ok) {
    let ans = escapeHtml(result.answer);
    if (peopleData) {
      const names = Object.keys(peopleData).sort((a, b) => b.length - a.length);
      for (const n of names) {
        const re = new RegExp(escapeRegex(escapeHtml(n)), 'g');
        ans = ans.replace(re, `<span class="clickable-name" data-name="${escapeHtml(n)}">${escapeHtml(n)}</span>`);
      }
    }
    html += `<pre>========== 答案 ==========\n${ans}</pre>`;
  } else {
    html += `<pre>❌ ${escapeHtml(result.error || '查询失败')}</pre>`;
  }
  outputPre.innerHTML = html;
  bindClickableNames();
  return result.ok ? stripHtml(result.answer) : (result.error || '查询失败');
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function stripHtml(s) { return s.replace(/<[^>]+>/g, ''); }

}

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const speechRecognitionSupported = !!SpeechRecognitionAPI;
let isListening = false;
function setupSpeechRecognition() {
  const micBtn = document.getElementById('micBtn'), micStatus = document.getElementById('micStatus');
  if (!speechRecognitionSupported) { micBtn.disabled = true; micStatus.textContent = '（当前浏览器不支持语音识别，可直接打字）'; return; }
  let currentRecognizer = null, queryTriggered = false, autoStopTimer = null, forceStopTimer = null;
  function reset(msg) { clearTimeout(autoStopTimer); clearTimeout(forceStopTimer); isListening = false; micBtn.classList.remove('listening'); if (msg) micStatus.textContent = msg; }
  function createRec() {
    const r = new SpeechRecognitionAPI(); r.lang = 'zh-CN'; r.continuous = false; r.interimResults = true;
    r.onstart = () => {
      isListening = true; queryTriggered = false;
      document.getElementById('voiceQueryInput').value = '';
      micBtn.classList.add('listening'); micStatus.textContent = '🎙️ 正在听...';
      autoStopTimer = setTimeout(() => { try { r.stop(); } catch(e){} }, 10000);
    };
    r.onresult = (e) => {
      let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      document.getElementById('voiceQueryInput').value = t;
      if (e.results[e.results.length - 1].isFinal) { queryTriggered = true; micStatus.textContent = '✅ 识别完成'; runNaturalQueryAgent(t); }
    };
    r.onerror = (e) => reset(`⚠️ 识别出错：${e.error}`);
    r.onend = () => {
      const triggered = queryTriggered;
      reset(null); currentRecognizer = null;
      if (!triggered) {
        const t = document.getElementById('voiceQueryInput').value.trim();
        if (t) { micStatus.textContent = '✅ 已结束'; runNaturalQueryAgent(t); }
        else micStatus.textContent = '⚠️ 没有识别到内容。';
      }
    };
    return r;
  }
  micBtn.addEventListener('click', () => {
    if (isListening) { try { currentRecognizer && currentRecognizer.abort(); } catch(e){} reset('已手动停止。'); currentRecognizer = null; return; }
    currentRecognizer = createRec();
    try {
      currentRecognizer.start();
      forceStopTimer = setTimeout(() => { if (isListening) { try { currentRecognizer && currentRecognizer.abort(); } catch(e){} reset('⚠️ 识别超时'); currentRecognizer = null; } }, 15000);
    } catch (e) { micStatus.textContent = '⚠️ 启动失败：' + e.message; }
  });
}

  const mk = n => `<span class="clickable-name" data-name="${escapeHtml(n)}">${escapeHtml(n)}</span>`;
  for (const gap of Array.from(byGap.keys()).sort((a,b) => b - a)) {
    lines.push(`\n${gap > 0 ? '上' + gap + '辈' : (gap === 0 ? '同辈' : '下' + (-gap) + '辈')} ——————————`);
    const items = byGap.get(gap).sort((a,b) => (a.info.person.birthYear ?? 9999) - (b.info.person.birthYear ?? 9999));
    for (const it of items) {
      const rel = getRelationship(peopleData[startName], it.info.person, it.info.pathPersons, it.info.pathOps);
      let line = `  ${rel} ${mk(it.name)}`;
      if (it.info.person.spouse && it.info.person.spouse.length) {
        line += ` 配 ${it.info.person.spouse.filter(s => peopleData[s]).map(s => mk(s)).join('、')}`;
      }
      lines.push(line);
    }
  }
  return lines.join('\n');
}

function queryPairRelation(a, b) {
  if (!peopleData) return { ok: false, message: '数据未加载' };
  if (!peopleData[a]) return { ok: false, message: `'${a}' 不在家谱中` };
  if (!peopleData[b]) return { ok: false, message: `'${b}' 不在家谱中` };
  if (a === b) return { ok: false, message: '同一个人' };
  const rels = bfsRelationships(a);
  if (!rels[b]) return { ok: false, message: '未找到可推导的路径' };
  const rel = getRelationship(peopleData[a], peopleData[b], rels[b].pathPersons, rels[b].pathOps);
  return { ok: true, nameA: a, nameB: b, relation: rel };
}

// ★ 修复版：精确匹配候选列表
function queryPersonsByRelation(name, relTerm) {
  if (!peopleData[name]) return { ok: false, message: `'${name}' 不在家谱中` };
  if (!relTerm) return { ok: false, message: '请输入关系称呼' };
  const candidates = resolveRelationCandidates(relTerm);
  const rels = bfsRelationships(name);
  const matches = [];
  for (const [pname, info] of Object.entries(rels)) {
    if (pname === name) continue;
    const rel = getRelationship(peopleData[name], peopleData[pname], info.pathPersons, info.pathOps);
    if (candidates.includes(rel)) matches.push({ name: pname, relation: rel });
  }
  const note = candidates.length > 1 ? `（按 ${candidates.join(' / ')} 匹配）` : (candidates[0] !== relTerm ? `（按「${candidates[0]}」匹配）` : '');
  return matches.length
    ? { ok: true, name, relTerm, matches, note }
    : { ok: false, message: `未找到 '${name}' 的「${relTerm}」${note}` };
}

async function listOnlineFiles(personName) {
  const m = await loadManifest();
  if (m && m[personName]) return m[personName].map(fn => ({ name: fn, url: `${GITHUB_BASE}${encodeURIComponent(personName)}/${encodeURIComponent(fn)}` }));
  const candidates = [`${personName}.jpg`, `${personName}.jpeg`, `${personName}.png`, `${personName}.gif`, `${personName}.txt`, `${personName}.md`];

  if (['mp3','wav'].includes(ext)) return `<audio controls src="${url}"></audio><br><a href="${url}" download>下载</a>`;

  return `<a href="${url}" download>下载 ${fileName}</a>`;
}
async function previewLocalFile(file, fileName) {

  return html;
}

// 图形树
let treeState = { canvas: null, ctx: null, rootName: '', baseNodes: new Set(), dynamicNodes: new Set(), expanded: new Set(), offsetX: 0, offsetY: 0, scale: 0.8, nodesList: [] };
function buildBaseSet(root) {
  if (!root) return new Set();
  const nodes = new Set([root.name]);
  (function up(p, g) { if (!p || g > 3) return; if (p.fatherObj) { nodes.add(p.fatherObj.name); up(p.fatherObj, g+1); } if (p.motherObj) { nodes.add(p.motherObj.name); up(p.motherObj, g+1); } })(root, 1);
  (function down(p, g) { if (!p || g > 3) return; for (const c of p.children) { nodes.add(c.name); down(c, g+1); } })(root, 1);
  for (const sp of root.spouse) { const s = peopleData[sp]; if (s) { nodes.add(s.name); if (s.fatherObj) nodes.add(s.fatherObj.name); if (s.motherObj) nodes.add(s.motherObj.name); } }
  return nodes;
}
function toggleNode(name) {
  const node = peopleData[name];
  if (!node || !node.children.length) return false;
  const root = peopleData[treeState.rootName];
  const isParent = root && (root.fatherObj?.name === name || root.motherObj?.name === name);
  const targets = isParent ? node.children.filter(c => c.name !== treeState.rootName) : node.children;
  if (!targets.length) return false;
  if (treeState.expanded.has(name)) { for (const c of targets) { treeState.dynamicNodes.delete(c.name); treeState.expanded.delete(c.name); } treeState.expanded.delete(name); }
  else { for (const c of targets) treeState.dynamicNodes.add(c.name); treeState.expanded.add(name); }
  renderTree(); return true;
}
function renderTree() {
  if (!treeState.canvas || !treeState.ctx) return;
  const ctx = treeState.ctx, canvas = treeState.canvas;
  const all = new Set([...treeState.baseNodes, ...treeState.dynamicNodes]);
  if (!all.size) return;
  const genMap = new Map([[treeState.rootName, 0]]);
  const q = [{ name: treeState.rootName, gen: 0 }];
  const vis = new Set([treeState.rootName]);
  while (q.length) {
    const { name, gen } = q.shift();
    const p = peopleData[name]; if (!p) continue;
    for (const c of p.children) if (all.has(c.name) && !vis.has(c.name)) { vis.add(c.name); genMap.set(c.name, gen+1); q.push({ name: c.name, gen: gen+1 }); }
    if (p.fatherObj && all.has(p.fatherObj.name) && !vis.has(p.fatherObj.name)) { vis.add(p.fatherObj.name); genMap.set(p.fatherObj.name, gen-1); q.push({ name: p.fatherObj.name, gen: gen-1 }); }
    if (p.motherObj && all.has(p.motherObj.name) && !vis.has(p.motherObj.name)) { vis.add(p.motherObj.name); genMap.set(p.motherObj.name, gen-1); q.push({ name: p.motherObj.name, gen: gen-1 }); }
    for (const s of p.spouse) if (all.has(s) && !vis.has(s)) { vis.add(s); genMap.set(s, gen); q.push({ name: s, gen }); }
  }
  const levels = new Map();
  for (const n of all) { const g = genMap.get(n); if (g === undefined) continue; if (!levels.has(g)) levels.set(g, []); levels.get(g).push({ name: n, person: peopleData[n] }); }
  for (const [g, ps] of levels) ps.sort((a,b) => (a.person.birthYear ?? 9999) - (b.person.birthYear ?? 9999));
  const gens = Array.from(levels.keys()).sort((a,b) => a - b);
  const yStep = 140, xStep = 150, positions = new Map();
  for (const g of gens) {
    const ps = levels.get(g);
    const startX = -(ps.length - 1) * xStep / 2;
    ps.forEach((it, i) => positions.set(it.name, { x: startX + i * xStep, y: g * yStep }));
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save(); ctx.translate(treeState.offsetX, treeState.offsetY); ctx.scale(treeState.scale, treeState.scale);
  ctx.beginPath(); ctx.strokeStyle = '#cca47d'; ctx.lineWidth = 2.5;
  for (const n of all) { const p = peopleData[n], pos = positions.get(n); if (!p || !pos) continue; for (const c of p.children) if (all.has(c.name)) { const cp = positions.get(c.name); if (cp) { ctx.moveTo(pos.x, pos.y); ctx.lineTo(cp.x, cp.y); } } }
  ctx.stroke();
  ctx.beginPath(); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.8;
  const drawn = new Set();
  for (const n of all) {
    const p = peopleData[n]; if (!p || p.sex !== '男') continue;
    const pos = positions.get(n); if (!pos) continue;
    for (const s of p.spouse) if (all.has(s) && !drawn.has(n+'|'+s) && !drawn.has(s+'|'+n)) { const sp = positions.get(s); if (sp) { ctx.moveTo(pos.x, pos.y); ctx.lineTo(sp.x, sp.y); drawn.add(n+'|'+s); } }
  }
  ctx.stroke();
  treeState.nodesList = [];
  for (const n of all) {
    const p = peopleData[n], pos = positions.get(n); if (!p || !pos) continue;
    const alive = !p.info || !/卒|故|病故|去世/.test(p.info);
    ctx.beginPath(); ctx.arc(pos.x, pos.y, 28, 0, 2*Math.PI);
    ctx.fillStyle = alive ? '#2ecc71' : '#95a5a6'; ctx.fill();
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (n.length <= 2) ctx.fillText(n, pos.x, pos.y);
    else { ctx.fillText(n.slice(0,2), pos.x, pos.y - 6); ctx.fillText(n.slice(2), pos.x, pos.y + 6); }
    if (p.birthYear) { ctx.fillStyle = '#555'; ctx.font = '10px sans-serif'; ctx.fillText(p.birthYear, pos.x, pos.y + 38); }
    treeState.nodesList.push({ name: n, x: pos.x, y: pos.y });
  }
  ctx.restore();
}
function initTree(rootName) {
  treeState.rootName = rootName;
  if (!peopleData[rootName]) return;
  treeState.baseNodes = buildBaseSet(peopleData[rootName]);
  treeState.dynamicNodes = new Set(); treeState.expanded = new Set(); treeState.scale = 0.75;
  treeState.canvas = document.getElementById('treeCanvas');
  treeState.ctx = treeState.canvas.getContext('2d');
  document.getElementById('treeModal').classList.add('active');
  setTimeout(() => {
    const c = document.getElementById('treeCanvasContainer'), r = c.getBoundingClientRect();
    const W = Math.max(r.width, window.innerWidth * 0.95), H = Math.max(r.height, window.innerHeight * 0.75);
    treeState.canvas.width = W; treeState.canvas.height = H;
    treeState.offsetX = W / 2; treeState.offsetY = 150;
    renderTree();
  }, 120);
}
function bindGestures() {
  const c = document.getElementById('treeCanvas'); if (!c) return;
  let drag = false, ds = { x: 0, y: 0 }, td = 0, ts = 1;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  c.addEventListener('mousedown', e => { drag = true; ds.x = e.clientX - treeState.offsetX; ds.y = e.clientY - treeState.offsetY; e.preventDefault(); });
  window.addEventListener('mousemove', e => { if (!drag) return; treeState.offsetX = e.clientX - ds.x; treeState.offsetY = e.clientY - ds.y; renderTree(); });
  window.addEventListener('mouseup', () => drag = false);
  c.addEventListener('wheel', e => { e.preventDefault(); treeState.scale = Math.min(2.5, Math.max(0.3, treeState.scale * (e.deltaY > 0 ? 0.9 : 1.1))); renderTree(); }, { passive: false });
  c.addEventListener('touchstart', e => { const t = e.touches; if (t.length === 1) { drag = true; ds.x = t[0].clientX - treeState.offsetX; ds.y = t[0].clientY - treeState.offsetY; } else if (t.length === 2) { drag = false; td = dist(t); ts = treeState.scale; } }, { passive: true });
  c.addEventListener('touchmove', e => { const t = e.touches; if (t.length === 1 && drag) { e.preventDefault(); treeState.offsetX = t[0].clientX - ds.x; treeState.offsetY = t[0].clientY - ds.y; renderTree(); } else if (t.length === 2) { e.preventDefault(); const d = dist(t); if (td > 0) { treeState.scale = Math.min(2.5, Math.max(0.3, ts * (d / td))); renderTree(); } } }, { passive: false });
  c.addEventListener('touchend', () => { drag = false; td = 0; });
  c.addEventListener('click', e => {
    const r = c.getBoundingClientRect();
    const sx = c.width / r.width, sy = c.height / r.height;
    const wx = ((e.clientX - r.left) * sx - treeState.offsetX) / treeState.scale;
    const wy = ((e.clientY - r.top) * sy - treeState.offsetY) / treeState.scale;
    let hit = null;
    for (const n of treeState.nodesList) if (Math.hypot(wx - n.x, wy - n.y) <= 30) { hit = n.name; break; }
    if (hit) { const p = peopleData[hit]; if (p.children?.length) toggleNode(hit); else showPersonMediaInModal(hit); }
  });
}

window.addEventListener('scroll', () => { document.getElementById('toTopBtn').style.display = window.scrollY > 300 ? 'flex' : 'none'; });

document.getElementById('statBtn').addEventListener('click', async () => {
  const body = document.getElementById('statModalBody');
  body.innerHTML = '<div class="stat-empty">⏳ 统计中...</div>';
  statModal.classList.add('active');
  try {
    let stats = [];
    const names = Object.keys(peopleData || {});
    if (!names.length) { body.innerHTML = '<div class="stat-empty">⚠️ 数据未加载</div>'; return; }
    const resp = await fetch('https://fengzd45.github.io/codex1/manifest.json');
    if (resp.ok) {
      const mf = await resp.json(), ns = new Set(names);
      for (const [n, files] of Object.entries(mf)) {
        if (!ns.has(n) || !files.length) continue;
        let txt = 0, img = 0, vid = 0;
        for (const fn of files) {
          const ext = fn.split('.').pop().toLowerCase();
          if (['txt','md','json'].includes(ext)) txt++;
          else if (['jpg','jpeg','png','gif','webp'].includes(ext)) img++;
          else if (['mp4','webm','mp3','wav'].includes(ext)) vid++;
          else txt++;
        }
        stats.push({ name: n, txt, img, vid, total: files.length });
      }
    }
    stats.sort((a,b) => b.total - a.total);
    if (!stats.length) { body.innerHTML = '<div class="stat-empty">📭 暂无资料</div>'; return; }
    let html = `<div class="stat-summary">📊 共 ${stats.length} 位人物有资料</div><table class="stat-table"><thead><tr><th>姓名</th><th class="num">📄</th><th class="num">🖼️</th><th class="num">🎵</th><th class="num">📦</th></tr></thead><tbody>`;
    for (const s of stats) html += `<tr><td><span class="clickable-name" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span></td><td class="num">${s.txt}</td><td class="num">${s.img}</td><td class="num">${s.vid}</td><td class="num"><strong>${s.total}</strong></td></tr>`;
    html += '</tbody></table>';
    body.innerHTML = html;
    body.querySelectorAll('.clickable-name').forEach(el => {
      el.onclick = function(e) {
        e.stopPropagation(); e.preventDefault();
        const n = this.getAttribute('data-name');
        if (n && peopleData[n]) { _fromStatModal = true; statModal.classList.remove('active'); setTimeout(() => showPersonMediaInModal(n), 50); }
      };
    });
  } catch(e) { body.innerHTML = `<div class="stat-empty">❌ 失败：${e.message}</div>`; }
});
document.getElementById('closeStatModalBtn').addEventListener('click', e => { e.stopPropagation(); statModal.classList.remove('active'); _fromStatModal = false; });
statModal.addEventListener('click', e => { if (e.target === statModal) { statModal.classList.remove('active'); _fromStatModal = false; } });

document.getElementById('aiStatusLine').textContent = AGENT_CONFIG.enabled ? '🤖 Agent 已启用（DeepSeek + 工具调用）' : '🤖 Agent 已关闭';
</script>
</body>
</html>

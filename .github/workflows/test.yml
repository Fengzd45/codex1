name: 🔍 单独调试【sync_feishu_data.py】引擎

on:
  workflow_dispatch:

jobs:
  test_run:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 检出本地仓库最新 main 代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_SUPER_TOKEN }}
          ref: 'main'
          persist-credentials: true

      - name: 2. 部署Python运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装网络及拼音底层依赖
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests pypinyin

      - name: 4. 灌注保险柜密钥并【单试同步程序】
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_PWD_TABLE_ID: ${{ secrets.FEISHU_PWD_TABLE_ID }}
          FAMILY_NAME_TAG: ${{ secrets.FAMILY_NAME_TAG }}
        run: |
          echo "==== 🚀 启动单项测试：开始执行同步逻辑 ===="
          python sync_feishu_data.py
          echo "==== 🏁 单项测试执行完毕 ===="

      - name: 5. 自动提交变动（如果有照片下载成功则入库）
        env:
          SUPER_TOKEN: ${{ secrets.MY_SUPER_TOKEN }}
        run: |
          # 🔥 彻底放弃默认机器人，直接锁定为您个人的 GitHub 账号与专属虚拟邮箱
          git config --local user.name "Fengzd45"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 强行刷新 Git 索引，确保精准捕获文件的细微文本变动
          git diff > /dev/null 2>&1
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "==== 💾 检测到数据或照片有变动，开始准备提交 ===="
            git add .
            git commit -m "单项调试触发: 档案尝试更新 [skip ci]"
            
            # 🔥 核心锁钥：先拉取远程最新状态进行变动融合，防止指针打架
            git pull --rebase origin main
            
            git push "https://x-access-token:${SUPER_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
            echo "==== 🎉 成功！新数据已顺利以 Fengzd45 身份写入仓库 ===="
          else
            echo "==== ℹ️ 报告：本次运行未发现任何新文件或新照片被下载。仓库无变动。 ===="
          fi

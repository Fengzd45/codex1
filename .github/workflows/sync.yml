
name: 家族档案双向智能同步引擎

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [feishu_sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: 1. 检出家族GitHub仓库代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 2. 部署Python运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装网络及飞书底层依赖
        run: |
          pip install requests

      - name: 4. 从各家保险柜灌注密钥，并启动超级引擎
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_PWD_TABLE_ID: ${{ secrets.FEISHU_PWD_TABLE_ID }}
          FAMILY_NAME_TAG: ${{ secrets.FAMILY_NAME_TAG }}
        run: |
          python sync_feishu_data.py

      - name: 5. 自动提交并推送变动到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "飞书即时同步: 家族档案更新 [skip ci]"
            git push origin main
          else
            echo "没有检测到文件变动，跳过提交。"
          fi

name: 家族数据自动同步（飞书→仓库）

on:
  schedule:
    - cron: '0 16 * * *'      # 每天北京时间 0 点运行（UTC 16:00）
  workflow_dispatch:          # 允许手动在 GitHub 网页点按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          # 如果你没把 PAT 加到 Secrets，就去 GitHub Settings 里加一下
          token: ${{ secrets.PAT }}

      - name: 安装 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests pypinyin

      - name: 运行同步脚本（从飞书拉取数据）
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_PWD_TABLE_ID: ${{ secrets.FEISHU_PWD_TABLE_ID }}
        # 注意：把这里的 mmb.py 换成你真正上传的脚本名字（比如 sync_feishu_data.py）
        run: |
          python sync_feishu_data.py

      - name: 提交更新到仓库
        run: |
          git config user.name "家族同步机器人"
          git config user.email "bot@family.com"
          git add family_data.jsonl 资料/ manifest.json || true
          git diff --staged --quiet || git commit -m "🤖 自动同步飞书数据 $(date '+%Y-%m-%d %H:%M')"
          # 加上 -f 防止之前那种 408 超时导致的本地远程不匹配
          git push -f origin main

name: 家族档案 AI Agent 智能同步引擎

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [feishu_sync]

jobs:
  agent_sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 检出家族GitHub仓库代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_SUPER_TOKEN }}
          ref: 'main'
          persist-credentials: true

      - name: 2. 部署Python运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装网络及 Agent 依赖
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests pypinyin openai

      - name: 4. 执行 AI Agent 数据校验与同步
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_PWD_TABLE_ID: ${{ secrets.FEISHU_PWD_TABLE_ID }}
          FAMILY_NAME_TAG: ${{ secrets.FAMILY_NAME_TAG }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          python sync_feishu_data.py --enable-agent

      - name: 5. 自动提交 Agent 生成的索引与变动
        env:
          SUPER_TOKEN: ${{ secrets.MY_SUPER_TOKEN }}
        run: |
          git config --local user.name "Family-AI-Agent"
          git config --local user.email "agent@family.local"
          
          git diff > /dev/null 2>&1
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "==== 💾 检测到数据或 AI 诊断有变动，开始提交 ===="
            git add .
            git commit -m "🤖 AI Agent: 飞书数据同步与关系链智能校验 [skip ci]"
            git pull --rebase origin main
            git push "https://x-access-token:${SUPER_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
            echo "==== 🎉 成功提交到仓库 ===="
          else
            echo "==== ℹ️ 未检测到文件变动，跳过提交。 ===="
          fi

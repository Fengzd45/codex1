name: 家族档案双向智能同步引擎

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [feishu_sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      # ====== 关键修改点：在此处显式注入 GITHUB_TOKEN，彻底根治 128 错误 ======
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install dependencies
        run: |
          pip install requests

      - name: 4. Run sync script
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_PWD_TABLE_ID: ${{ secrets.FEISHU_PWD_TABLE_ID }}
          FAMILY_NAME_TAG: ${{ secrets.FAMILY_NAME_TAG }}
        run: |
          python sync_feishu_data.py

      - name: 5. Push changes to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "飞书即时同步: 家族档案更新 [skip ci]"
            git push
          else
            echo "No changes detected, skipping commit."
          fi

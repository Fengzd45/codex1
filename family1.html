<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族亲戚关系网查询系统 (常规完善版)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
            --panel-bg: #ffffff;
            --border: #e9ecef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #333; height: 100vh; display: flex; flex-direction: column; }

        header { background: var(--primary); color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { font-size: 1.25rem; font-weight: 600; }

        .container { display: flex; flex: 1; overflow: hidden; }

        /* 左侧控制与搜索面板 */
        .sidebar { width: 360px; background: var(--panel-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: #eee; }
        .tab-btn { flex: 1; padding: 0.75rem; border: none; background: none; cursor: pointer; font-weight: 600; color: #666; }
        .tab-btn.active { background: white; color: var(--accent); border-bottom: 2px solid var(--accent); }

        .tab-content { flex: 1; padding: 1rem; overflow-y: auto; display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #555; }
        input, select, button { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
        button.btn-primary { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button.btn-primary:hover { background: #2980b9; }

        .result-card { background: #f1f8ff; border-left: 4px solid var(--accent); padding: 0.8rem; border-radius: 4px; margin-top: 1rem; }
        .result-card h3 { font-size: 1rem; margin-bottom: 0.5rem; color: var(--primary); }

        /* 右侧画布与可视化 */
        .main-stage { flex: 1; position: relative; background: #fafafa; overflow: hidden; display: flex; flex-direction: column; }
        .toolbar { position: absolute; top: 1rem; right: 1rem; background: white; padding: 0.5rem; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; gap: 0.5rem; z-index: 5; }
        .toolbar button { width: auto; padding: 0.4rem 0.8rem; font-size: 0.8rem; }

        #tree-canvas { width: 100%; height: 100%; cursor: grab; }
        #tree-canvas:active { cursor: grabbing; }

        /* 状态栏 */
        footer { background: #fff; border-top: 1px solid var(--border); padding: 0.5rem 1.5rem; font-size: 0.8rem; color: #777; display: flex; justify-content: space-between; }
        .tag { display: inline-block; padding: 2px 6px; background: #e0e0e0; border-radius: 3px; font-size: 0.75rem; margin-right: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>家族亲戚关系网查询系统 (常规完善版)</h1>
        <div>
            <input type="file" id="file-input" accept=".jsonl,.json" style="display:none">
            <button onclick="document.getElementById('file-input').click()" style="width:auto; padding:0.4rem 0.8rem; background:#4cae4c; color:white; border:none; border-radius:4px; cursor:pointer;">导入 JSONL 数据</button>
            <button onclick="loadSampleData()" style="width:auto; padding:0.4rem 0.8rem; background:#f0ad4e; color:white; border:none; border-radius:4px; cursor:pointer;">加载测试数据</button>
        </div>
    </header>

    <div class="container">
        <!-- 左侧面板 -->
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('single')">单人查询</button>
                <button class="tab-btn" onclick="switchTab('pair')">双人关系测算</button>
                <button class="tab-btn" onclick="switchTab('filter')">高级筛选</button>
            </div>

            <!-- Tab 1: 单人关系网展开 -->
            <div id="tab-single" class="tab-content active">
                <div class="form-group">
                    <label>选择/搜索成员 (n):</label>
                    <input type="text" id="single-search" list="person-list" placeholder="输入姓名或ID...">
                    <datalist id="person-list"></datalist>
                </div>
                <button class="btn-primary" onclick="querySingle()">展开亲属关系网</button>

                <div id="single-result"></div>
            </div>

            <!-- Tab 2: 双人关系计算 (补全核心功能) -->
            <div id="tab-pair" class="tab-content">
                <div class="form-group">
                    <label>起点成员 (A):</label>
                    <input type="text" id="pair-a" list="person-list" placeholder="起点姓名或ID...">
                </div>
                <div class="form-group">
                    <label>目标成员 (B):</label>
                    <input type="text" id="pair-b" list="person-list" placeholder="终点姓名或ID...">
                </div>
                <button class="btn-primary" onclick="queryPair()">推算两者关系</button>

                <div id="pair-result"></div>
            </div>

            <!-- Tab 3: 高级条件筛选 -->
            <div id="tab-filter" class="tab-content">
                <div class="form-group">
                    <label>按性别筛选 (s):</label>
                    <select id="filter-gender" onchange="applyFilter()">
                        <option value="">全部</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>生存状态 (基于 info 关键词):</label>
                    <select id="filter-status" onchange="applyFilter()">
                        <option value="">全部</option>
                        <option value="健在">健在</option>
                        <option value="已故">已故 / 卒</option>
                    </select>
                </div>
                <div id="filter-result-summary" style="font-size: 0.85rem; color: #666; margin-top: 1rem;"></div>
            </div>
        </div>

        <!-- 右侧画布区 -->
        <div class="main-stage">
            <div class="toolbar">
                <button onclick="resetZoom()">重置视角</button>
                <button onclick="exportCanvas()">导出图片</button>
            </div>
            <canvas id="tree-canvas"></canvas>
        </div>
    </div>

    <footer>
        <span id="status-text">系统就绪，请加载数据。</span>
        <span id="stats-text">节点数: 0</span>
    </footer>

    <script>
        // 核心数据结构: n.s.f.m.sp.info
        let database = new Map(); // key: ID/Name (n), value: Person Object

        // DOM 元素引用
        const canvas = document.getElementById('tree-canvas');
        const ctx = canvas.getContext('2d');
        let transform = { x: 0, y: 0, scale: 1 };
        let isDragging = false;
        let startPan = { x: 0, y: 0 };
        let highlightedNodes = new Set();
        let selectedNode = null;

        // 初始化 Canvas 尺寸
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        // UI 选项卡切换
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tabName === 'single') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-single').classList.add('active');
            } else if(tabName === 'pair') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-pair').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('tab-filter').classList.add('active');
            }
        }

        // 1. 数据解析模块
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                parseJSONL(evt.target.result);
            };
            reader.readAsText(file);
        });

        function parseJSONL(text) {
            database.clear();
            const lines = text.split('\n');
            let count = 0;

            lines.forEach(line => {
                if (!line.trim()) return;
                try {
                    const item = JSON.parse(line);
                    // 标准数据结构规范: n, s, f, m, sp, info
                    if (item.n) {
                        database.set(item.n, {
                            n: item.n,
                            s: item.s || '未知',
                            f: item.f || '',
                            m: item.m || '',
                            sp: item.sp || '',
                            info: item.info || '',
                            // 计算坐标用
                            x: 0, y: 0
                        });
                        count++;
                    }
                } catch (e) {
                    console.error("解析行错误:", line);
                }
            });

            updateDatalist();
            document.getElementById('status-text').innerText = `成功加载 ${count} 条家族记录`;
            document.getElementById('stats-text').innerText = `节点数: ${count}`;
            autoLayout();
            draw();
        }

        function loadSampleData() {
            const sample = 
`{"n":"冯高祖","s":"男","f":"","m":"","sp":"高祖母","info":"1900-1970"}
{"n":"高祖母","s":"女","f":"","m":"","sp":"冯高祖","info":"1902-1975"}
{"n":"冯曾祖","s":"男","f":"冯高祖","m":"高祖母","sp":"曾祖母","info":"1925-1998"}
{"n":"曾祖母","s":"女","f":"","m":"","sp":"冯曾祖","info":"1928-2005"}
{"n":"冯祖父","s":"男","f":"冯曾祖","m":"曾祖母","sp":"祖母","info":"1950-"}
{"n":"祖母","s":"女","f":"","m":"","sp":"冯祖父","info":"1952-"}
{"n":"舅公","s":"男","f":"冯曾祖","m":"曾祖母","sp":"","info":"1955-"}
{"n":"冯父亲","s":"男","f":"冯祖父","m":"祖母","sp":"母亲","info":"1975-"}
{"n":"母亲","s":"女","f":"","m":"","sp":"冯父亲","info":"1977-"}
{"n":"姑姑","s":"女","f":"冯祖父","m":"祖母","sp":"","info":"1978-"}
{"n":"自己","s":"男","f":"冯父亲","m":"母亲","sp":"","info":"2000-"}
{"n":"堂兄","s":"男","f":"冯祖父","m":"祖母","sp":"","info":"1998-"}`;

            parseJSONL(sample);
        }

        function updateDatalist() {
            const list = document.getElementById('person-list');
            list.innerHTML = '';
            database.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.n;
                list.appendChild(opt);
            });
        }

        // 2. 双人关系求解引擎 (基于广度优先搜索 BFS)
        function queryPair() {
            const nameA = document.getElementById('pair-a').value.trim();
            const nameB = document.getElementById('pair-b').value.trim();
            const container = document.getElementById('pair-result');

            if (!database.has(nameA) || !database.has(nameB)) {
                container.innerHTML = `<div class="result-card" style="border-color:red">错误: 请确保输入的两人都在系统数据中。</div>`;
                return;
            }

            if (nameA === nameB) {
                container.innerHTML = `<div class="result-card">同一个人无需计算。</div>`;
                return;
            }

            // BFS 求解最短路径
            const queue = [[nameA, []]];
            const visited = new Set([nameA]);
            let foundPath = null;

            while (queue.length > 0) {
                const [curr, path] = queue.shift();

                if (curr === nameB) {
                    foundPath = path;
                    break;
                }

                const p = database.get(curr);
                if (!p) continue;

                // 寻找所有相连关系
                const neighbors = [];
                if (p.f) neighbors.push({ id: p.f, rel: '父亲' });
                if (p.m) neighbors.push({ id: p.m, rel: '母亲' });
                if (p.sp) neighbors.push({ id: p.sp, rel: '配偶' });

                // 寻找子女
                database.forEach(child => {
                    if (child.f === curr || child.m === curr) {
                        neighbors.push({ id: child.n, rel: child.s === '女' ? '女儿' : '儿子' });
                    }
                });

                for (let nxt of neighbors) {
                    if (!visited.has(nxt.id) && database.has(nxt.id)) {
                        visited.add(nxt.id);
                        queue.push([nxt.id, [...path, { from: curr, to: nxt.id, rel: nxt.rel }]]);
                    }
                }
            }

            if (foundPath) {
                highlightedNodes = new Set([nameA, nameB, ...foundPath.map(step => step.to)]);
                
                let pathText = foundPath.map(step => ` ➔ [${step.rel}] ➔ <b>${step.to}</b>`).join('');
                container.innerHTML = `
                    <div class="result-card">
                        <h3>推算成功</h3>
                        <p><b>关系路径：</b><br><b>${nameA}</b>${pathText}</p>
                        <p style="margin-top:0.5rem; font-size:0.85rem; color:#666;">路径长度: ${foundPath.length} 代/节点距离</p>
                    </div>
                `;
            } else {
                highlightedNodes.clear();
                container.innerHTML = `<div class="result-card">未找到两者之间的直接血缘或姻亲纽带。</div>`;
            }
            draw();
        }

        // 3. 单人查询
        function querySingle() {
            const name = document.getElementById('single-search').value.trim();
            const container = document.getElementById('single-result');
            const p = database.get(name);

            if (!p) {
                container.innerHTML = `<div class="result-card" style="border-color:red">未找到该成员</div>`;
                return;
            }

            selectedNode = name;
            highlightedNodes = new Set([name]);

            // 查找子女
            let children = [];
            database.forEach(c => {
                if (c.f === name || c.m === name) children.push(c.n);
            });

            container.innerHTML = `
                <div class="result-card">
                    <h3>${p.n} (${p.s})</h3>
                    <p><b>生卒/信息:</b> ${p.info || '暂无说明'}</p>
                    <hr style="margin: 0.5rem 0; border:none; border-top:1px solid #ccc;">
                    <p><b>父亲:</b> ${p.f || '未登记'}</p>
                    <p><b>母亲:</b> ${p.m || '未登记'}</p>
                    <p><b>配偶:</b> ${p.sp || '未登记'}</p>
                    <p><b>子女:</b> ${children.length ? children.join('、') : '未登记'}</p>
                </div>
            `;
            draw();
        }

        // 4. 高级条件筛选
        function applyFilter() {
            const gender = document.getElementById('filter-gender').value;
            const status = document.getElementById('filter-status').value;

            highlightedNodes.clear();

            let count = 0;
            database.forEach(p => {
                let matchGender = !gender || p.s === gender;
                let matchStatus = true;

                if (status === '健在') {
                    matchStatus = !p.info.includes('卒') && !p.info.includes('已故') && !p.info.match(/\d{4}\s*-\s*\d{4}/);
                } else if (status === '已故') {
                    matchStatus = p.info.includes('卒') || p.info.includes('已故') || p.info.match(/\d{4}\s*-\s*\d{4}/);
                }

                if (matchGender && matchStatus) {
                    highlightedNodes.add(p.n);
                    count++;
                }
            });

            document.getElementById('filter-result-summary').innerText = `已高亮匹配到的 ${count} 名成员`;
            draw();
        }

        // 5. 画布渲染与极简布局逻辑
        function autoLayout() {
            // 极简分层布局（按代际）
            let x = 100, y = 100;
            let i = 0;
            database.forEach(p => {
                p.x = 150 + (i % 5) * 160;
                p.y = 100 + Math.floor(i / 5) * 120;
                i++;
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(transform.x, transform.y);
            ctx.scale(transform.scale, transform.scale);

            // 绘制连接线
            database.forEach(p => {
                // 连线到父亲
                if (p.f && database.has(p.f)) {
                    const parent = database.get(p.f);
                    drawLine(p.x, p.y, parent.x, parent.y, '#999', '父子/女');
                }
                // 连线到配偶
                if (p.sp && database.has(p.sp)) {
                    const sp = database.get(p.sp);
                    drawLine(p.x, p.y, sp.x, sp.y, '#e74c3c', '配偶');
                }
            });

            // 绘制节点
            database.forEach(p => {
                const isHighlighted = highlightedNodes.has(p.n);
                const isSelected = selectedNode === p.n;

                ctx.beginPath();
                ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
                
                // 节点颜色分配
                if (isSelected) ctx.fillStyle = '#f1c40f';
                else if (isHighlighted) ctx.fillStyle = '#2ecc71';
                else ctx.fillStyle = p.s === '女' ? '#e84393' : '#0984e3';

                ctx.fill();
                ctx.lineWidth = isHighlighted ? 3 : 1;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                // 绘制文字
                ctx.fillStyle = '#333';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.n, p.x, p.y + 40);
            });

            ctx.restore();
        }

        function drawLine(x1, y1, x2, y2, color, label) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // 交互逻辑 (拖拽与缩放)
        canvas.addEventListener('mousedown', e => {
            isDragging = true;
            startPan = { x: e.clientX - transform.x, y: e.clientY - transform.y };
        });

        canvas.addEventListener('mousemove', e => {
            if (isDragging) {
                transform.x = e.clientX - startPan.x;
                transform.y = e.clientY - startPan.y;
                draw();
            }
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const zoom = e.deltaY < 0 ? 1.1 : 0.9;
            transform.scale *= zoom;
            draw();
        });

        function resetZoom() {
            transform = { x: 0, y: 0, scale: 1 };
            draw();
        }

        function exportCanvas() {
            const link = document.createElement('a');
            link.download = '家族关系图谱.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // 初始化
        resizeCanvas();
    </script>
</body>
</html>

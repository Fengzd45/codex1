<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>家族关系查询系统 · DeepSeek Agent 加强版</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f0e8; margin: 0; padding: 16px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: #8b5a2b; color: white; padding: 24px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 1.6rem; }
        .header p { margin: 8px 0 0; opacity: 0.9; font-size: 0.85rem; }
        .content { padding: 20px; }
        
        .status-bar { background: #f0e8d8; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; font-size: 0.85rem; font-weight: bold; color: #5a3d1e; }
        
        /* 搜索框区 */
        .section-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; color: #8b5a2b; display: flex; align-items: center; gap: 6px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 16px; }
        .input-group input { flex: 1; padding: 12px 16px; font-size: 0.95rem; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        .input-group button { background: #8b5a2b; color: white; border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
        .input-group button:hover { background: #724820; }
        
        /* 结果展示区 */
        .result-box { background: #faf8f0; border-radius: 12px; padding: 16px; font-size: 0.9rem; line-height: 1.6; border: 1px solid #e0d6c0; margin-bottom: 24px; min-height: 80px; }
        .result-box pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: inherit; }
        
        /* AI Agent 对话区 */
        .agent-card { background: #f0f7ff; border: 1px solid #cce3ff; border-radius: 16px; padding: 20px; }
        .agent-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: #1e40af; font-size: 1.1rem; font-weight: bold; }
        .chat-box { background: white; border-radius: 12px; padding: 14px; height: 220px; overflow-y: auto; font-size: 0.9rem; border: 1px solid #cbd5e1; margin-bottom: 12px; }
        .chat-msg { margin-bottom: 10px; }
        .chat-msg.user { text-align: right; }
        .chat-msg.user span { background: #dbeafe; padding: 8px 14px; border-radius: 14px; display: inline-block; color: #1e3a8a; }
        .chat-msg.agent span { background: #f1f5f9; padding: 8px 14px; border-radius: 14px; display: inline-block; color: #0f172a; border: 1px solid #e2e8f0; }
        .chat-msg.system { color: #64748b; font-style: italic; font-size: 0.85rem; }
        
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input { flex: 1; padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 20px; outline: none; font-size: 0.9rem; }
        .chat-input-row button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .chat-input-row button:hover { background: #1d4ed8; }

        .footer { text-align: center; padding: 16px; font-size: 0.75rem; color: #a0aec0; border-top: 1px solid #edf2f7; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📜 家族关系查询系统</h1>
        <p>支持节点精确检索 & DeepSeek AI Agent 智能推理问答</p>
    </div>

    <div class="content">
        <!-- 数据加载状态 -->
        <div class="status-bar" id="statusBar">⏳ 正在读取 family_data.jsonl 数据库...</div>

        <!-- 传统节点精确查询区 -->
        <div class="section-title">🔍 传统精确节点查询</div>
        <div class="input-group">
            <input type="text" id="nodeSearchInput" placeholder="输入成员姓名 (例: 冯宗德)" value="冯宗德">
            <button onclick="searchNode()">查询节点</button>
        </div>
        <div class="result-box" id="nodeResult">
            <pre>请输入姓名点击“查询节点”查看详细履历信息...</pre>
        </div>

        <!-- DeepSeek AI Agent 智能问答区 -->
        <div class="agent-card">
            <div class="agent-header">
                <span style="font-size: 1.3rem;">🤖</span>
                <span>DeepSeek 家族 AI 智能助手</span>
            </div>
            
            <div class="chat-box" id="chatHistory">
                <div class="chat-msg system">你好！我是家族 AI 助手。你可以问我复杂的亲属关系，比如：“某某和某某是什么关系？”或“按习俗我该怎么称呼某某？”</div>
            </div>

            <div class="chat-input-row">
                <input type="text" id="agentInput" placeholder="向 AI 助手提问亲戚关系或生平..." onkeypress="handleKeyPress(event)">
                <button onclick="askAIAgent()">咨询 Agent</button>
            </div>
        </div>
    </div>

    <div class="footer">家族关系网 | 基于 DeepSeek 大模型与 RAG 技术驱动</div>
</div>

<script>
let familyDatabase = {};

// 1. 初始化自动加载 JSONL 数据
async function loadFamilyData() {
    const statusBar = document.getElementById('statusBar');
    try {
        const response = await fetch('./family_data.jsonl');
        if (response.ok) {
            const text = await response.text();
            familyDatabase = parseJsonl(text);
            const count = Object.keys(familyDatabase).length;
            statusBar.innerText = `✅ 家族数据库加载成功，共包含 ${count} 位成员档案。`;
            statusBar.style.color = '#2e6a38';
        } else {
            statusBar.innerText = '⚠️ 未找到 family_data.jsonl 文件，请确保数据文件已同步到仓库根目录。';
            statusBar.style.color = '#c53030';
        }
    } catch (e) {
        statusBar.innerText = 'ℹ️ 无法访问 JSONL 数据库，请检查网络或路径配置。';
        statusBar.style.color = '#c53030';
    }
}

// 解析 JSONL 文本为 JavaScript 对象
function parseJsonl(jsonlText) {
    const lines = jsonlText.split(/\r?\n/);
    const db = {};
    for (const line of lines) {
        if (!line.trim()) continue;
        try {
            const record = JSON.parse(line);
            if (record.n) {
                db[record.n] = record;
            }
        } catch (e) {
            console.error('JSONL 解析行失败:', line);
        }
    }
    return db;
}

// 2. 传统精确查节点逻辑
function searchNode() {
    const name = document.getElementById('nodeSearchInput').value.trim();
    const resultBox = document.getElementById('nodeResult');
    
    if (!name) {
        resultBox.innerHTML = '<pre>⚠️ 请输入正确的成员姓名。</pre>';
        return;
    }

    const info = familyDatabase[name];
    if (!info) {
        resultBox.innerHTML = `<pre>❌ 未在档案库中找到成员：“${name}”</pre>`;
        return;
    }

    const spouseText = Array.isArray(info.sp) ? info.sp.join(', ') : (info.sp || '无');
    
    const outputText = `👤 姓名 ID (n): ${info.n}
⚧ 性别 (s): ${info.s || '未登记'}
👨 父亲 (f): ${info.f || '未登记'}
👩 母亲 (m): ${info.m || '未登记'}
💍 配偶 (sp): ${spouseText}
📝 生卒日及备注 (info): ${info.info || '无'}`;

    resultBox.innerHTML = `<pre>${outputText}</pre>`;
}

// 3. AI Agent 对话交互
function handleKeyPress(e) {
    if (e.key === 'Enter') askAIAgent();
}

async function askAIAgent() {
    const inputField = document.getElementById('agentInput');
    const history = document.getElementById('chatHistory');
    const query = inputField.value.trim();

    if (!query) return;

    // 显示用户问话
    history.innerHTML += `<div class="chat-msg user"><span>${escapeHtml(query)}</span></div>`;
    inputField.value = '';
    history.scrollTop = history.scrollHeight;

    // 显示思考状态
    const loadingId = "loading_" + Date.now();
    history.innerHTML += `<div class="chat-msg system" id="${loadingId}">🤖 DeepSeek Agent 正在解析家族知识库并推理中...</div>`;
    history.scrollTop = history.scrollHeight;

    // 组装带 RAG 知识库上下的 Prompt
    const contextRecords = Object.values(familyDatabase);
    const systemPrompt = `你是一位严谨体贴的家族档案 AI 专家。
你可以读取家族树结构数据(n=姓名, s=性别, f=父, m=母, sp=配偶, info=生卒信息)。

家族背景数据如下：
${JSON.stringify(contextRecords)}

请根据上述真实数据，结合中国传统亲属称谓习惯解答用户的疑问。若数据未提及请明确说明，切勿编造关系。`;

    try {
        // 调用后端 Agent API (注意：开发调试时也可配置后端转发)
        const response = await fetch('https://api.deepseek.com/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer YOUR_LLM_API_KEY_HERE' // 可替换为您实际的 API 代理点
            },
            body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: query }
                ],
                temperature: 0.1
            })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();

        if (data.choices && data.choices[0]) {
            const reply = data.choices[0].message.content;
            history.innerHTML += `<div class="chat-msg agent"><span>🤖 ${escapeHtml(reply)}</span></div>`;
        } else {
            history.innerHTML += `<div class="chat-msg system">⚠️ Agent 接口未返回结果，请检查密钥或调用格式。</div>`;
        }
    } catch (err) {
        if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
        history.innerHTML += `<div class="chat-msg system">⚠️ 连接 Agent 失败，请确认 API Key 是否在后台环境配置成功。</div>`;
    }

    history.scrollTop = history.scrollHeight;
}

function escapeHtml(text) {
    return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
}

// 页面加载完成后自动触发数据读取
window.onload = loadFamilyData;
</script>

</body>
</html>
